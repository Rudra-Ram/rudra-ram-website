<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2efe7">
<meta name="description" content="Rudra-Ram. A new beginning. Our website is coming soon.">
<title>Rudra-Ram — Coming Soon</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--paper:#f2efe7;--ink:#263d34;--muted:#5b695f;--accent:#aa593b;--line:#c9cec2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{min-height:100svh;padding:36px 5.5vw 25px;display:flex;flex-direction:column;position:relative;overflow:hidden}header,footer{display:flex;justify-content:space-between;align-items:center;gap:20px;position:relative;z-index:1}header{padding-bottom:24px;border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;font-size:24px;letter-spacing:-1px}.domain{font-size:11px;letter-spacing:1.8px;text-transform:uppercase}.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:72px 0 88px;position:relative}.emblem{width:84px;height:84px;margin-bottom:34px;color:var(--accent)}.eyebrow{font-size:10px;font-weight:600;letter-spacing:4px;text-transform:uppercase;margin:0 0 25px}h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(68px,12.5vw,190px);font-weight:400;line-height:1;letter-spacing:-.065em;margin:0 0 28px;padding-right:.065em}.intro{font-family:Georgia,serif;font-size:clamp(22px,2.5vw,32px);font-weight:400;margin:0 0 17px;letter-spacing:-.4px}.description{font-size:14px;color:var(--muted);line-height:1.8;margin:0;max-width:330px}.status{display:inline-flex;gap:10px;align-items:center;margin-top:38px;border:1px solid var(--line);border-radius:30px;padding:12px 18px;font-size:10px;letter-spacing:1.8px;text-transform:uppercase}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}footer{border-top:1px solid var(--line);padding-top:21px;color:var(--muted);font-size:10px;letter-spacing:.7px}.corner{position:absolute;width:360px;height:360px;border:1px solid var(--line);border-radius:50%;right:-250px;top:35%;pointer-events:none}.corner:after{content:'';position:absolute;inset:28px;border:1px solid var(--line);border-radius:50%}@media(max-width:600px){main{padding:25px 24px 22px}header{padding-bottom:21px}.brand{font-size:22px}.domain{font-size:9px;letter-spacing:1px}.hero{padding:60px 0}.emblem{width:66px;height:66px;margin-bottom:30px}.eyebrow{letter-spacing:3px;font-size:9px}h1{font-size:clamp(54px,15vw,90px);margin-bottom:26px}.description{font-size:13px}.corner{display:none}footer{font-size:9px;letter-spacing:0;gap:12px}.status{margin-top:30px}}
</style>
</head>
<body>
<main>
<header><span class="brand">Rudra-Ram</span><span class="domain">rudra-ram.com</span></header>
<section class="hero" aria-labelledby="page-title">
<svg class="emblem" viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width=".7"/><path d="M50 17v66M17 50h66M27 27l46 46M27 73l46-46" stroke="currentColor" stroke-width=".7"/><circle cx="50" cy="50" r="28" stroke="currentColor" stroke-width=".7"/><circle cx="50" cy="50" r="7" fill="currentColor"/></svg>
<p class="eyebrow">A new beginning</p>
<h1 id="page-title">Rudra-Ram</h1>
<p class="intro">Something new is taking shape.</p>
<p class="description">We’re creating our new home on the web.<br>We look forward to sharing more with you.</p>
<div class="status"><span class="dot" aria-hidden="true"></span>Website coming soon</div>
</section>
<div class="corner" aria-hidden="true"></div>
<footer><span>© 2026 Rudra-Ram</span><span>rudra-ram.com</span></footer>
</main>
</body>
</html>
